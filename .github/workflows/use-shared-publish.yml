name: Build and Publish

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write      # video-core-js creates the GitHub Release on behalf of this repo
  id-token: write      # npm Trusted Publishing + attestation OIDC
  attestations: write  # actions/attest-build-provenance

jobs:
  build-and-publish:
    environment: npm-release
    uses: newrelic/video-core-js/.github/workflows/npm-publish.yml@45ea8078cd9fcb5ad301c0266bfe8d775cdbd42d # master
    with:
      s3-path: 'media-agents/browser/hls-js'
      file-to-upload: 'dist/umd/newrelic-video-hls.min.js'
    secrets: inherit   # passes GITHUB_TOKEN + AWS keys so video-core-js can create the release
