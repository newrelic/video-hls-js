name: Build and Publish

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    uses: newrelic/video-core-js/.github/workflows/npm-publish.yml@d8d79f546b38d0aaf372879f5ccd0a0d97afc129 # master
    with:
      s3-path: 'media-agents/browser/hls-js'
      file-to-upload: 'dist/umd/newrelic-video-hls.min.js'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
