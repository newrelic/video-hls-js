name: Build and Publish

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    environment: npm-release
    uses: newrelic/video-core-js/.github/workflows/npm-publish.yml@45ea8078cd9fcb5ad301c0266bfe8d775cdbd42d # master
    with:
      s3-path: 'media-agents/browser/hls-js'
      file-to-upload: 'dist/umd/newrelic-video-hls.min.js'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
